name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check src/scene.js
          node --check src/hud.js
          node --check src/entry.js
      - name: Build is committed and reproducible
        run: |
          node build.mjs
          git diff --exit-code client.js
      - name: Host half smoke test
        run: node test-host.mjs
      - name: Browser half smoke test
        run: node test-client.mjs
